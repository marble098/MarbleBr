config:
  validation: false
  warningsAsErrors: false

complexity:
  CognitiveComplexMethod:
    active: false
  ComplexCondition:
    active: false
  CyclomaticComplexMethod:
    active: false
  LargeClass:
    active: false
  LongMethod:
    active: false
  LongParameterList:
    active: false
  NestedBlockDepth:
    active: false
  TooManyFunctions:
    active: false

naming:
  FunctionNaming:
    active: true
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
  TopLevelPropertyNaming:
    active: false
  MatchingDeclarationName:
    active: false

potential-bugs:
  ImplicitDefaultLocale:
    active: false

style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 160
  ReturnCount:
    active: false
  ThrowsCount:
    active: false
  WildcardImport:
    active: false
  UnusedParameter:
    active: false
  UnusedPrivateClass:
    active: false
  UnusedPrivateFunction:
    active: false
  UnusedPrivateProperty:
    active: false
  UnusedVariable:
    active: false
  ForbiddenComment:
    active: false
  LoopWithTooManyJumpStatements:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
