# Project-wide Gradle settings for MarbleBr
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8 --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED
kotlin.daemon.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

# MarbleBr Application Versioning (updated automatically by scripts/bump_version.kts & scripts/bump_version.sh)
MARBLE_VERSION_NAME=1.0.0
MARBLE_VERSION_CODE=1
