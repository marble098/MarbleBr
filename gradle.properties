org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration Cache: هر فراخوانیِ Gradle بخشِ configuration (≈ یک تا چند دقیقه در این پروژه) را
# بازیابی می‌کند. حالتِ problems=warn تضمین می‌کند در صورتِ ناسازگاریِ یک پلاگین، بیلد شکست
# نخورد و خودکار به اجرای عادی برمی‌گردد؛ مسئله‌ها در لاگ هشدار می‌شوند تا تدریجاً برطرف شوند.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# MarbleBr Semantic Versioning (توسط scripts/bump_version.sh به‌صورت خودکار ارتقا می‌یابد)
MARBLE_VERSION_NAME=1.12.1
MARBLE_VERSION_CODE=182
