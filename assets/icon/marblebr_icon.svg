<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="52%" stop-color="#162447" />
      <stop offset="100%" stop-color="#1F306E" />
    </linearGradient>

    <radialGradient id="auroraGlow" cx="44%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3A86FF" stop-opacity="0.45" />
      <stop offset="65%" stop-color="#7209B7" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0.0" />
    </radialGradient>

    <radialGradient id="marbleBody" cx="38%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#B8FBFF" />
      <stop offset="28%" stop-color="#4895EF" />
      <stop offset="68%" stop-color="#3F37C9" />
      <stop offset="100%" stop-color="#1A1648" />
    </radialGradient>

    <radialGradient id="subsurfaceTeal" cx="62%" cy="66%" r="48%">
      <stop offset="0%" stop-color="#74F8E5" stop-opacity="0.48" />
      <stop offset="58%" stop-color="#7209B7" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#1A1648" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="220" fill="url(#auroraGlow)" />

  <!-- Multi-layer Ambient Shadow -->
  <ellipse cx="256" cy="395" rx="138" ry="34" fill="#040814" fill-opacity="0.52" />
  <ellipse cx="256" cy="390" rx="102" ry="22" fill="#02040A" fill-opacity="0.35" />

  <!-- 3D Glossy Marble Sphere -->
  <circle cx="256" cy="246" r="154" fill="url(#marbleBody)" />
  <circle cx="256" cy="246" r="142" fill="url(#subsurfaceTeal)" />

  <!-- Organic Flowing Marble Veins -->
  <path d="M 118 216 C 162 174, 208 238, 254 196 C 300 154, 344 192, 392 180"
        fill="none" stroke="#D9E2FF" stroke-opacity="0.55" stroke-width="7.5" stroke-linecap="round" />
  <path d="M 126 282 C 176 250, 222 312, 276 268 C 324 230, 358 272, 392 246"
        fill="none" stroke="#74F8E5" stroke-opacity="0.48" stroke-width="6.2" stroke-linecap="round" />
  <path d="M 156 152 C 198 202, 232 168, 282 226 C 318 268, 340 302, 366 326"
        fill="none" stroke="#EBDDFF" stroke-opacity="0.38" stroke-width="4.8" stroke-linecap="round" />
  <path d="M 148 324 C 194 304, 240 338, 290 304 C 318 284, 344 298, 370 288"
        fill="none" stroke="#B0C6FF" stroke-opacity="0.40" stroke-width="4.4" stroke-linecap="round" />

  <!-- Subtle Persistent Session Infinity Loop inside the Marble Core -->
  <path d="M 210 248 C 184 248, 168 230, 168 208 C 168 186, 184 168, 210 168 C 234 168, 246 190, 256 208 C 266 226, 278 248, 302 248 C 328 248, 344 230, 344 208 C 344 186, 328 168, 302 168 C 278 168, 266 190, 256 208 C 246 226, 234 248, 210 248 Z"
        fill="none" stroke="#74F8E5" stroke-opacity="0.34" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 210 248 C 184 248, 168 230, 168 208 C 168 186, 184 168, 210 168 C 234 168, 246 190, 256 208 C 266 226, 278 248, 302 248 C 328 248, 344 230, 344 208 C 344 186, 328 168, 302 168 C 278 168, 266 190, 256 208 C 246 226, 234 248, 210 248 Z"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Subtle Keyhole / Session Lock Core -->
  <circle cx="256" cy="284" r="11" fill="#FFFFFF" fill-opacity="0.75" />
  <rect x="251.5" y="291" width="9" height="20" rx="4.5" fill="#FFFFFF" fill-opacity="0.68" />

  <!-- Specular Highlights & Rim Light -->
  <path d="M 164 156 C 186 124, 230 114, 258 124 C 230 140, 190 162, 168 192 C 154 180, 154 166, 164 156 Z"
        fill="#FFFFFF" fill-opacity="0.70" />
  <circle cx="156" cy="204" r="9" fill="#FFFFFF" fill-opacity="0.86" />
  <path d="M 176 370 A 148 148 0 0 0 388 278"
        fill="none" stroke="#74F8E5" stroke-opacity="0.52" stroke-width="7" stroke-linecap="round" />
</svg>
