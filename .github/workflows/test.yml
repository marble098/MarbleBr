name: Test Suite & Static Analysis

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit_and_quality_tests:
    name: Unit Tests, ktlint & detekt
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate CHANGELOG.md format
        run: ./scripts/check_changelog.sh

      - name: Test Semantic Versioning Script
        run: ./scripts/test_bump_version.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run ktlintCheck & detekt
        run: ./gradlew ktlintCheck detekt --stacktrace

      - name: Run All Module Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/**"
