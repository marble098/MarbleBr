name: Test Suite & Static Analysis

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit_tests_and_lint:
    name: Unit Tests, ktlint, detekt & Changelog Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Persian CHANGELOG.md rules
        env:
          ENFORCE_CHANGELOG_DIFF: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          BASE_REF: origin/main
        run: ./scripts/check_changelog.sh

      - name: Run Version Bump Algorithm Script Tests
        run: ./scripts/test_bump_version.sh

      - name: Run Unified Dependency Updater Script Tests
        run: python3 scripts/test_update_dependencies.py

      - name: Run release publishing tests
        run: ./scripts/test_publish_release.sh

      - name: Run install smoke-test and Gradle retry script tests
        run: |
          ./scripts/test_smoke_install_apks.sh
          ./scripts/test_gradle_retry.sh

      - name: Run session extension isolation tests
        run: |
          node scripts/test_session_extension.js
          node scripts/test_session_content.js
          node scripts/test_credential_autofill.js

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Run Release Keystore Preparation Unit Tests
        run: ./scripts/test_prepare_release_keystore.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: "basic"
          validate-wrappers: false

      # ktlint و detekt در یک فراخوانی Gradle اجرا می‌شوند: یک daemon راه‌اندازی و یک
      # configuration به‌اشتراک گذاشته می‌شود (در CI حدود یک تا دو دقیقه سریع‌تر است).
      - name: Run ktlint & detekt static analysis
        run: |
          set -o pipefail
          if ! ./scripts/gradle_retry.sh /tmp/lint.log ktlintCheck detekt --stacktrace; then
            ERR_SUMMARY=$(grep -E "e:|error:|FAILURE:|What went wrong:|\.kt:[0-9]+|\.kts:[0-9]+|Execution failed" /tmp/lint.log | tail -n 30 | tr '\n' ' ')
            echo "::error title=StaticAnalysisFailure::${ERR_SUMMARY}"
            exit 1
          fi

      - name: Run all module unit tests
        run: |
          set -o pipefail
          if ! ./scripts/gradle_retry.sh /tmp/unit.log testDebugUnitTest --stacktrace; then
            ERR_SUMMARY=$({ grep -E "e:|error:|FAILED" /tmp/unit.log | tail -n 15; grep -A 20 "What went wrong:" /tmp/unit.log | head -n 22; } | tr '\n' ' ')
            echo "::error title=UnitTestFailure::${ERR_SUMMARY}"
            exit 1
          fi

      - name: Summarize unit test failures
        if: failure()
        run: |
          python3 - <<'PYDETAILS'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('.').glob('**/build/test-results/testDebugUnitTest/TEST-*.xml'):
              for test in ET.parse(path).iter('testcase'):
                  for failure in test.findall('failure') + test.findall('error'):
                      message = failure.get('message', '') + '\n' + (failure.text or '')[:8000]
                      message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f"::error title={test.get('classname', '')}.{test.get('name', '')}::{message}")
          PYDETAILS

      - name: Compile Android instrumentation tests
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
        run: |
          set -o pipefail
          if ! ./scripts/gradle_retry.sh /tmp/android-test-build.log :app:assembleDebugAndroidTest --stacktrace; then
            ERR_SUMMARY=$({ grep -E "e:|error:|FAILED" /tmp/android-test-build.log | tail -n 15; grep -A 20 "What went wrong:" /tmp/android-test-build.log | head -n 22; } | tr '\n' ' ')
            echo "::error title=AndroidTestCompileFailure::${ERR_SUMMARY}"
            exit 1
          fi

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/testDebugUnitTest/**"
          if-no-files-found: ignore
