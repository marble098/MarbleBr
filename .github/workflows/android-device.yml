name: Android device smoke tests

on:
  pull_request:
    branches:
      - main
    # Draft PRها تستِ ایمولاتور را رد می‌کنند؛ با ready شدن اجرا می‌شود (تا ۴۰ دقیقه در زمان بازبینی صرفه‌جویی می‌شود).
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-device-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  gecko_account_and_address_bar:
    name: Gecko account isolation & address bar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # تستِ ایمولاتور در Draft PR رد می‌شود؛ پس از آماده‌شدنِ PR یا روی main اجرا می‌شود.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: false
      - name: Enable emulator acceleration
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
          fi
      - name: Run tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: >-
            ./scripts/gradle_retry.sh /tmp/android-device.log :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.marble098.marblebr.AddressBarInstrumentedTest,com.marble098.marblebr.GeckoAccountIsolationInstrumentedTest
            --stacktrace
      - name: Summarize device test failures
        if: failure()
        run: |
          python3 - <<'PYDETAILS'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('.').glob('**/build/outputs/androidTest-results/connected/**/*.xml'):
              for test in ET.parse(path).iter('testcase'):
                  for failure in test.findall('failure') + test.findall('error'):
                      message = failure.get('message', '') + '\n' + (failure.text or '')[:8000]
                      message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f"::error title={test.get('classname', '')}.{test.get('name', '')}::{message}")
          PYDETAILS
      - name: Upload device test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-device-test-report
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore
