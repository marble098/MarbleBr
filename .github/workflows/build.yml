name: Build & Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_verify:
    name: Lint, Test & Build Multi-ABI APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Persian CHANGELOG.md rules
        env:
          ENFORCE_CHANGELOG_DIFF: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          BASE_REF: origin/main
        run: ./scripts/check_changelog.sh

      - name: Run Semantic Versioning script unit tests
        run: ./scripts/test_bump_version.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run ktlint & detekt static analysis
        run: |
          set -o pipefail
          if ! ./gradlew ktlintCheck detekt --stacktrace 2>&1 | tee /tmp/lint.log; then
            ERR_SUMMARY=$({ grep -E "e:|error:|FAILED|\.kt:[0-9]+" /tmp/lint.log | tail -n 15; grep -A 20 "What went wrong:" /tmp/lint.log | head -n 22; } | tr '\n' ' ')
            echo "::error title=StaticAnalysisFailure::${ERR_SUMMARY}"
            exit 1
          fi

      - name: Run Unit Tests (Vault, Health Guard, Version Algorithm, Browser)
        run: |
          set -o pipefail
          if ! ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee /tmp/test.log; then
            ERR_SUMMARY=$({ grep -E "e:|error:|FAILED" /tmp/test.log | tail -n 15; grep -A 20 "What went wrong:" /tmp/test.log | head -n 22; } | tr '\n' ' ')
            echo "::error title=UnitTestFailure::${ERR_SUMMARY}"
            exit 1
          fi

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${RUNNER_TEMP}/marblebr-release.jks"
          if [[ -n "${KEYSTORE_BASE64}" ]]; then
            echo "${KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_FILE}"
            echo "MARBLE_KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
            echo "MARBLE_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "MARBLE_KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "MARBLE_KEY_PASSWORD=${KEY_PASSWORD}" >> "$GITHUB_ENV"
          else
            echo "Generating ephemeral CI keystore for verification build..."
            keytool -genkeypair -v \
              -keystore "${KEYSTORE_FILE}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias marblebr \
              -storepass marblebr_ci_pass \
              -keypass marblebr_ci_pass \
              -dname "CN=MarbleBr, OU=Mobile, O=Marble098, L=Tehran, S=Tehran, C=IR"
            echo "MARBLE_KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
            echo "MARBLE_KEYSTORE_PASSWORD=marblebr_ci_pass" >> "$GITHUB_ENV"
            echo "MARBLE_KEY_ALIAS=marblebr" >> "$GITHUB_ENV"
            echo "MARBLE_KEY_PASSWORD=marblebr_ci_pass" >> "$GITHUB_ENV"
          fi

      - name: Assemble Release APKs (All ABIs + Universal)
        run: |
          set -o pipefail
          if ! ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee /tmp/assemble.log; then
            ERR_SUMMARY=$({ grep -E "e:|error:|FAILED" /tmp/assemble.log | tail -n 15; grep -A 20 "What went wrong:" /tmp/assemble.log | head -n 22; } | tr '\n' ' ')
            echo "::error title=AssembleReleaseFailure::${ERR_SUMMARY}"
            exit 1
          fi

      - name: Verify All 5 Required Architecture APKs Exist
        run: |
          APK_DIR="app/build/outputs/apk/release"
          ls -lh "${APK_DIR}"
          for abi in "arm64-v8a" "armeabi-v7a" "x86" "x86_64" "universal"; do
            if ! ls "${APK_DIR}"/*-"${abi}"-release*.apk >/dev/null 2>&1; then
              echo "❌ Missing release APK for architecture: ${abi}" >&2
              exit 1
            fi
            echo "✅ Found release APK for ${abi}"
          done

      - name: Upload Release APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: marblebr-release-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
