name: Release on Main Merge

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      verify_only:
        description: "Build and verify all signed APKs without committing a version bump or creating a draft release"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Bump Version, Sign All ABI APKs & Prepare Draft GitHub Release
    if: ${{ (github.ref == 'refs/heads/main' || inputs.verify_only) && !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enforce Persian CHANGELOG.md entry on merge
        run: |
          set -euo pipefail
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            ENFORCE_CHANGELOG_DIFF=true BASE_REF=HEAD~1 ./scripts/check_changelog.sh
          else
            ./scripts/check_changelog.sh
          fi

      - name: Run Version Bump Script Unit Tests
        run: ./scripts/test_bump_version.sh

      - name: Bump Version Automatically Based on Merge Diff Size
        id: bump
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            OLD_NAME=$(git show HEAD~1:gradle.properties | sed -n 's/^MARBLE_VERSION_NAME=//p')
            NEW_NAME=$(sed -n 's/^MARBLE_VERSION_NAME=//p' gradle.properties)
            if [[ "$NEW_NAME" != "$OLD_NAME" && "$NEW_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              ./scripts/bump_version.sh --base=HEAD~1 --keep-name
            else
              ./scripts/bump_version.sh --base=HEAD~1
            fi
          else
            ./scripts/bump_version.sh
          fi
          VERSION_NAME=$(grep -E '^MARBLE_VERSION_NAME=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          VERSION_CODE=$(grep -E '^MARBLE_VERSION_CODE=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          if [[ -z "${VERSION_NAME}" || -z "${VERSION_CODE}" ]]; then
            echo "::error title=VersionBumpFailure::نسخه‌دهی خودکار ناموفق بود (MARBLE_VERSION_NAME/CODE خالی است)."
            exit 1
          fi
          echo "::notice::نسخه جدید: v${VERSION_NAME} (code ${VERSION_CODE})"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Extract Latest Persian Release Notes from CHANGELOG.md
        id: notes
        run: |
          awk '
            /^## \[/ {
              if (found) exit;
              found=1;
              next;
            }
            found { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/release_notes.md"
          if [[ ! -s "${RUNNER_TEMP}/release_notes.md" ]]; then
            cp CHANGELOG.md "${RUNNER_TEMP}/release_notes.md"
          fi
          cat "${RUNNER_TEMP}/release_notes.md"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Run Release Keystore Unit Tests
        run: ./scripts/test_prepare_release_keystore.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: "basic"
          validate-wrappers: false

      - name: Prepare Release Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./scripts/prepare_release_keystore.sh

      - name: Build Signed Release APKs (arm64-v8a, armeabi-v7a, x86, x86_64, universal)
        run: ./scripts/gradle_retry.sh /tmp/release-build.log testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Rename and Collect All 5 Architecture APKs
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version_name }}"
          OUT_DIR="${RUNNER_TEMP}/release_apks"
          mkdir -p "${OUT_DIR}"
          ls -lh app/build/outputs/apk/release
          for abi in "arm64-v8a" "armeabi-v7a" "x86" "x86_64" "universal"; do
            SRC_APK=$(ls app/build/outputs/apk/release/*-"${abi}"-release*.apk 2>/dev/null | head -n 1 || true)
            if [[ -z "${SRC_APK}" ]]; then
              echo "::error title=MissingApk::APK معماری ${abi} تولید نشد."
              exit 1
            fi
            "$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)" verify "${SRC_APK}"
            cp "${SRC_APK}" "${OUT_DIR}/MarbleBr-v${VERSION}-${abi}.apk"
            echo "✅ ${abi}"
          done
          ls -lh "${OUT_DIR}"

      - name: Commit Bumped Version to main
        id: version_commit
        if: ${{ !inputs.verify_only }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): v${{ steps.bump.outputs.version_name }} (code ${{ steps.bump.outputs.version_code }})"
            # A rerun may find the identical version commit already on main.
            git fetch origin main
            if [[ "$(git rev-parse origin/main^)" == "$GITHUB_SHA" &&
                  "$(git rev-parse origin/main^{tree})" == "$(git rev-parse HEAD^{tree})" ]]; then
              echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create Draft GitHub Release and Attach All 5 APKs
        if: ${{ !inputs.verify_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.bump.outputs.version_name }}
          TARGET: ${{ steps.version_commit.outputs.sha }}
        run: |
          set -euo pipefail
          if existing=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            if [[ "$existing" != "true" ]]; then
              echo "::error::Release $TAG is already published. Refusing to modify it."
              exit 1
            fi
            gh release upload "$TAG" "${RUNNER_TEMP}/release_apks/"*.apk --clobber
          else
            gh release create "$TAG" "${RUNNER_TEMP}/release_apks/"*.apk --draft --target "$TARGET" \
              --title "MarbleBr $TAG" --notes-file "${RUNNER_TEMP}/release_notes.md"
          fi
