name: Release on Main Merge

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      verify_only:
        description: "Build and verify all signed APKs without committing a version bump or creating a draft release"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Bump Version, Sign All ABI APKs & Prepare Draft GitHub Release
    if: ${{ (github.ref == 'refs/heads/main' || inputs.verify_only) && !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enforce Persian CHANGELOG.md entry on merge
        run: |
          set -euo pipefail
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            ENFORCE_CHANGELOG_DIFF=true BASE_REF=HEAD~1 ./scripts/check_changelog.sh
          else
            ./scripts/check_changelog.sh
          fi

      - name: Run Version Bump Script Unit Tests
        run: ./scripts/test_bump_version.sh

      - name: Bump Version Automatically Based on Merge Diff Size
        id: bump
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            OLD_NAME=$(git show HEAD~1:gradle.properties | sed -n 's/^MARBLE_VERSION_NAME=//p')
            NEW_NAME=$(sed -n 's/^MARBLE_VERSION_NAME=//p' gradle.properties)
            if [[ "$NEW_NAME" != "$OLD_NAME" && "$NEW_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              ./scripts/bump_version.sh --base=HEAD~1 --keep-name
            else
              ./scripts/bump_version.sh --base=HEAD~1
            fi
          else
            ./scripts/bump_version.sh
          fi
          VERSION_NAME=$(grep -E '^MARBLE_VERSION_NAME=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          VERSION_CODE=$(grep -E '^MARBLE_VERSION_CODE=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          if [[ -z "${VERSION_NAME}" || -z "${VERSION_CODE}" ]]; then
            echo "::error title=VersionBumpFailure::نسخه‌دهی خودکار ناموفق بود (MARBLE_VERSION_NAME/CODE خالی است)."
            exit 1
          fi
          echo "::notice::نسخه جدید: v${VERSION_NAME} (code ${VERSION_CODE})"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Extract Latest Persian Release Notes from CHANGELOG.md
        id: notes
        run: |
          awk '
            /^## \[/ {
              if (found) exit;
              found=1;
              next;
            }
            found { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/release_notes.md"
          if [[ ! -s "${RUNNER_TEMP}/release_notes.md" ]]; then
            cp CHANGELOG.md "${RUNNER_TEMP}/release_notes.md"
          fi
          cat "${RUNNER_TEMP}/release_notes.md"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Run Release Keystore Unit Tests
        run: ./scripts/test_prepare_release_keystore.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: "basic"
          validate-wrappers: false

      - name: Prepare Release Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./scripts/prepare_release_keystore.sh

      - name: Build release APKs for all supported architectures
        run: ./scripts/gradle_retry.sh /tmp/release-build.log testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Download previous public APKs and verify the production-signed candidates
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version_name }}
        run: |
          set -euo pipefail
          source scripts/release_assets.sh
          releases="$(list_releases)"
          tags="$(public_baselines <<< "$releases")"
          mkdir "$RUNNER_TEMP/previous-apks"
          args=()
          for tag in $tags; do
            if [[ "$tag" == "v$VERSION" || "$(printf '%s\n' "$tag" "v$VERSION" | sort -V | tail -1)" != "v$VERSION" ]]; then
              echo "::error::v$VERSION must be newer than the already published $tag."
              exit 1
            fi
            name="MarbleBr-$tag-x86_64.apk"
            gh release download "$tag" --pattern "$name" --dir "$RUNNER_TEMP/previous-apks"
            args+=(--baseline "$RUNNER_TEMP/previous-apks/$name")
          done
          python3 scripts/verify_apks.py app/build/outputs/apk/release "$RUNNER_TEMP/release_apks" "${args[@]}"

      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm

      - name: Verify clean install and in-place upgrades with production signing
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash -O nullglob -c './scripts/smoke_install_apks.sh "$RUNNER_TEMP/release_apks" "$RUNNER_TEMP"/previous-apks/*.apk'

      - name: Commit Bumped Version to main
        id: version_commit
        if: ${{ !inputs.verify_only }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): v${{ steps.bump.outputs.version_name }} (code ${{ steps.bump.outputs.version_code }})"
            # A rerun may find the identical version commit already on main.
            git fetch origin main
            if [[ "$(git rev-parse origin/main^)" == "$GITHUB_SHA" &&
                  "$(git rev-parse origin/main^{tree})" == "$(git rev-parse HEAD^{tree})" ]]; then
              echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create draft with the verified APKs and SHA-256 checksums
        if: ${{ !inputs.verify_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.bump.outputs.version_name }}
          TARGET: ${{ steps.version_commit.outputs.sha }}
        run: |
          set -euo pipefail
          source scripts/release_assets.sh
          releases="$(list_releases)"
          existing="$(jq -c --arg tag "$TAG" '.[] | select(.tag_name == $tag)' <<< "$releases")"
          assets=("${RUNNER_TEMP}/release_apks/"*.apk "$RUNNER_TEMP/release_apks/SHA256SUMS")
          if [[ -n "$existing" ]]; then
            if ! jq -e --arg target "$TARGET" '.draft and .target_commitish == $target' <<< "$existing" >/dev/null; then
              echo "::error::Release $TAG is published or points to a different commit. Refusing to modify it."
              exit 1
            fi
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --draft --target "$TARGET" \
              --title "MarbleBr $TAG" --notes-file "${RUNNER_TEMP}/release_notes.md"
          fi
          releases="$(list_releases)"
          draft="$(jq -ce --arg tag "$TAG" '.[] | select(.draft and .tag_name == $tag)' <<< "$releases")"
          verify_release_assets "$draft" "$TAG" "$RUNNER_TEMP/release_apks/SHA256SUMS"
