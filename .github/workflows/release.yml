name: Release on Main Merge

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Bump Version, Sign All ABI APKs & Publish GitHub Release
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce Persian CHANGELOG.md entry on merge
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          if (( COMMIT_COUNT > 2 )); then
            ENFORCE_CHANGELOG_DIFF=true BASE_REF=HEAD~1 ./scripts/check_changelog.sh
          else
            ./scripts/check_changelog.sh
          fi

      - name: Run Version Bump Script Unit Tests
        run: ./scripts/test_bump_version.sh

      - name: Bump Version Automatically Based on Merge Diff Size
        id: bump
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          ./scripts/bump_version.sh --base=HEAD~1
          VERSION_NAME=$(grep -E '^MARBLE_VERSION_NAME=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          VERSION_CODE=$(grep -E '^MARBLE_VERSION_CODE=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Extract Latest Persian Release Notes from CHANGELOG.md
        id: notes
        run: |
          awk '
            /^## \[/ {
              if (found) exit;
              found=1;
              next;
            }
            found { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/release_notes.md"
          if [[ ! -s "${RUNNER_TEMP}/release_notes.md" ]]; then
            cp CHANGELOG.md "${RUNNER_TEMP}/release_notes.md"
          fi
          cat "${RUNNER_TEMP}/release_notes.md"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare Release Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${RUNNER_TEMP}/marblebr-release.jks"
          if [[ -n "${KEYSTORE_BASE64}" ]]; then
            echo "${KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_FILE}"
            echo "MARBLE_KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
            echo "MARBLE_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "MARBLE_KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "MARBLE_KEY_PASSWORD=${KEY_PASSWORD}" >> "$GITHUB_ENV"
          else
            echo "::warning::GitHub Secret KEYSTORE_BASE64 is not set; using fallback signing key. See docs/secrets-setup.md."
            keytool -genkeypair -v \
              -keystore "${KEYSTORE_FILE}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias marblebr \
              -storepass marblebr_ci_pass \
              -keypass marblebr_ci_pass \
              -dname "CN=MarbleBr, OU=Mobile, O=Marble098, L=Tehran, S=Tehran, C=IR"
            echo "MARBLE_KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
            echo "MARBLE_KEYSTORE_PASSWORD=marblebr_ci_pass" >> "$GITHUB_ENV"
            echo "MARBLE_KEY_ALIAS=marblebr" >> "$GITHUB_ENV"
            echo "MARBLE_KEY_PASSWORD=marblebr_ci_pass" >> "$GITHUB_ENV"
          fi

      - name: Build Signed Release APKs (arm64-v8a, armeabi-v7a, x86, x86_64, universal)
        run: ./gradlew testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Rename and Collect All 5 Architecture APKs
        run: |
          VERSION="${{ steps.bump.outputs.version_name }}"
          OUT_DIR="${RUNNER_TEMP}/release_apks"
          mkdir -p "${OUT_DIR}"
          for abi in "arm64-v8a" "armeabi-v7a" "x86" "x86_64" "universal"; do
            SRC_APK=$(ls app/build/outputs/apk/release/*-"${abi}"-release*.apk | head -n 1)
            cp "${SRC_APK}" "${OUT_DIR}/MarbleBr-v${VERSION}-${abi}.apk"
          done
          ls -lh "${OUT_DIR}"

      - name: Commit Bumped Version to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): v${{ steps.bump.outputs.version_name }} (code ${{ steps.bump.outputs.version_code }})"
            git push origin HEAD:main
          fi

      - name: Create GitHub Release and Attach All 5 APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version_name }}
          name: MarbleBr v${{ steps.bump.outputs.version_name }}
          body_path: ${{ runner.temp }}/release_notes.md
          files: ${{ runner.temp }}/release_apks/*.apk
          generate_release_notes: false
