name: Weekly Automated Dependency Update

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  weekly_update:
    name: Upgrade GeckoView, Compose, Kotlin & AndroidX Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Latest Stable/Beta Versions (GeckoView, Compose BOM, Kotlin, AGP)
        id: check_updates
        run: |
          python3 scripts/update_dependencies.py
          if git diff --quiet gradle/libs.versions.toml; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Build & Tests with Updated Dependencies
        id: verify_build
        if: steps.check_updates.outputs.updated == 'true'
        continue-on-error: true
        run: |
          ./gradlew ktlintCheck detekt testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Open Auto-Merge PR if Green
        if: steps.check_updates.outputs.updated == 'true' && steps.verify_build.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE_TAG=$(date -u +%Y-%m-%d)
          BRANCH="chore/weekly-deps-${DATE_TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add gradle/libs.versions.toml CHANGELOG.md
          git commit -m "chore(deps): آپدیت هفتگی خودکار وابستگی‌ها (${DATE_TAG})"
          git push -u origin "${BRANCH}" --force
          PR_URL=$(gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "chore(deps): آپدیت هفتگی خودکار وابستگی‌ها (${DATE_TAG})" \
            --body "### 🛠 بهبود
          - ارتقای خودکار هفتگی وابستگی‌ها (GeckoView، Compose BOM، Kotlin و کتابخانه‌های AndroidX).
          - تمامی تست‌های واحد، بررسی‌های ktlint/detekt و بیلد APK با موفقیت پاس شدند.")
          gh pr merge "${PR_URL}" --auto --squash || true

      - name: Create Diagnostic Issue if Update Build Failed
        if: steps.check_updates.outputs.updated == 'true' && steps.verify_build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE_TAG=$(date -u +%Y-%m-%d)
          DIFF_TEXT=$(git diff gradle/libs.versions.toml)
          gh issue create \
            --title "⚠️ خطا در آپدیت هفتگی خودکار وابستگی‌ها (${DATE_TAG})" \
            --body "آپدیت هفتگی خودکار وابستگی‌ها در مرحله بیلد یا تست با خطا مواجه شد.

          ### تغییرات نسخه‌ها:
          \`\`\`diff
          ${DIFF_TEXT}
          \`\`\`

          لطفاً لاگ اجرای GitHub Actions (#${GITHUB_RUN_ID}) را بررسی و ناسازگاری API را برطرف کنید."
          exit 1
